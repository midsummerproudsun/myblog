baseURL = "https://myblog.midsummerproudsun.workers.dev/"
title = "阳光传感器"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = false

[languages.zh-cn]
  locale = "zh-CN"
  label = "简体中文"

[module]
  [[module.imports]]
    path = "github.com/jmfergeau/hugo.386"
    # Declaring mounts for an import replaces ALL of that module's default
    # mounts. The theme ships a large static/ folder (Bootstrap's docs.css,
    # 14 unused jQuery plugins, application.js, 4 font formats, README.md)
    # that would otherwise be copied verbatim into public/. Only the folders
    # this site actually consumes are mounted; css/js arrive via assets/
    # instead, where Hugo minifies and fingerprints them.
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"

[pagination]
  pagerSize = 10

# /index.json — the client-side search index consumed by assets/js/site.js
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Shortcodes and hand-written HTML (embeds, <mark>, figures) are trusted here.
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[params]
  mainpagetitle = "盛夏骄阳"
  mainpagesubtitle = "日之所照·万象成集"
  mainpagedesc = "这里是阳光传感器，一块收集日光，转化热爱的太阳能板。"

  # 页脚版权信息
  copyrightname = "盛夏骄阳"
  copyrighturl = ""
  showhugo = true

  # hugo.386 开机动画开关（false = 保持动画）
  # 注意：fastLoad = true 会直接跳过动画并把 body 立即显示出来
  loadfastload = false
  loadonepass = false
  loadspeedfactor = 1.0

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]

  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 10

  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/post/"
    weight = 20

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    identifier = "about"
    name = "关于我"
    url = "/about/"
    weight = 40
